<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="440" viewBox="0 0 600 440" role="img" aria-label="DayForm: Scheduling platform with customizable templates for daily planning.">
<title>DayForm: Scheduling platform with customizable templates for daily planning.</title>

<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="80%"><stop offset="0" stop-color="#101a3d"/><stop offset="0.55" stop-color="#070b1c"/><stop offset="1" stop-color="#04060e"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1433"/><stop offset="1" stop-color="#080d22"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1"/></pattern>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowsm" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect x="6" y="6" width="588" height="428" rx="22"/></clipPath>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>

</defs>
<style>
.t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
.flow{stroke-dasharray:20 90;animation:flow 3s linear infinite}
.fd{stroke-dasharray:10 12;animation:flow2 1.4s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.scan{animation:scan 9s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-110}}
@keyframes flow2{to{stroke-dashoffset:-22}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(var(--h))}}
@media (prefers-reduced-motion: reduce){.flow,.fd,.pulse,.scan,.spin,.spinr{animation:none}}
</style>

<style>
.bob{animation:bob 5s ease-in-out infinite}
.bob2{animation:bob 6.5s ease-in-out infinite reverse}
.nudge{animation:nudge 1.8s ease-in-out infinite}
.wave{transform-box:view-box;animation:wave 2.4s ease-in-out infinite}
.orbit{transform-box:view-box;animation:spin 28s linear infinite}
.orbitr{transform-box:view-box;animation:spin 40s linear infinite reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(14deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
@media (prefers-reduced-motion: reduce){.bob,.bob2,.nudge,.wave,.orbit,.orbitr{animation:none}}
</style>
