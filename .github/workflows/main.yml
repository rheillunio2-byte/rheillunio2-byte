name: Update GitHub stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-and-stats
    steps:
      - uses: actions/checkout@v3

      # Create assets directory cleanly
      - name: Create assets directory
        run: mkdir -p assets

      # 1. Generate the 3D Graph Model SVG
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rheillunio2-byte

      # Move it directly to match your markdown asset path
      - name: Move 3D graph to assets
        run: mv profile-3d-contrib/profile-green-animate.svg assets/github-3d.svg

      # 2. Fetch the Stats Card directly (Bypasses runner container blocks)
      - name: Fetch GitHub Stats Card
        run: |
          curl -s "https://vercel.app" -o assets/github-stats.svg

      # 3. Commit the generated SVGs back to your assets folder
      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-3d.svg assets/github-stats.svg
          git commit -m "Refreshed GitHub Stats and 3D Graph" || exit 0
          git push
