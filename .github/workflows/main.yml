
name: RETL Profile Automation

on:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - ".github/workflows/main.yml"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retl-profile-update
  cancel-in-progress: true

jobs:
  update-profile:
    name: Generate Profile Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate SVG Profile Assets
        run: |
          python source/make_svgs.py
          python source/make_v2.py

      - name: Generate Hero Animation Frames
        run: |
          python source/render_hero.py frames

      - name: Build Hero GIF
        working-directory: source
        run: |
          chmod +x build_gif.sh
          ./build_gif.sh

      - name: Generate GitHub Statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python source/github_stats.py "${{ github.repository_owner }}"

      - name: Commit Generated Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "chore: automate profile asset updates"
            git push
          fi
